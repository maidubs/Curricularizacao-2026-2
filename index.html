<script>
(function (root) {
  'use strict';
  const worlds = root.GAME_WORLDS || [];
  const worldById = new Map(worlds.map(world => [world.id, world]));
  const questionById = new Map(worlds.flatMap(world => world.questions.map(question => [question.id, question])));
  const avatars = new Set(['bunny', 'cat', 'bird']);
  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const now = () => new Date().toISOString();
  const emptyRecord = () => ({ attempts: 0, hints: 0, solved: false });
  const cloneRecords = records => Object.fromEntries(Object.entries(records).map(([id, record]) => [id, { ...record }]));
  const cloneArrays = entries => Object.fromEntries(Object.entries(entries).map(([id, values]) => [id, values.slice()]));

  function createState() {
    const timestamp = now();
    return { version: 1, started: false, avatar: 'bunny', soundEnabled: true, startedAt: timestamp, updatedAt: timestamp, records: {}, active: null };
  }

  function clone(state) {
    return {
      version: 1,
      started: state.started,
      avatar: state.avatar,
      soundEnabled: state.soundEnabled,
      startedAt: state.startedAt,
      updatedAt: state.updatedAt,
      records: cloneRecords(state.records),
      active: state.active ? {
        worldId: state.active.worldId,
        index: state.active.index,
        replay: state.active.replay,
        records: cloneRecords(state.active.records),
        choiceOrder: cloneArrays(state.active.choiceOrder),
        wrongChoices: cloneArrays(state.active.wrongChoices)
      } : null
    };
  }

  function current(state) {
    if (!state.active) return null;
    const world = worldById.get(state.active.worldId);
    return world ? world.questions[state.active.index] || null : null;
  }

  function recordsFor(state) {
    return state.active && state.active.replay ? state.active.records : state.records;
  }

  function recordFor(state, questionId) {
    return recordsFor(state)[questionId] || emptyRecord();
  }

  function shuffle(values) {
    const result = values.slice();
    for (let i = result.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function start(state, avatar) {
    const result = clone(state);
    const selected = avatar === undefined ? result.avatar : avatar;
    if (!avatars.has(selected)) return result;
    const timestamp = now();
    if (!result.started) result.startedAt = timestamp;
    result.started = true;
    result.avatar = selected;
    result.updatedAt = timestamp;
    return result;
  }

  function startWorld(state, worldId) {
    const result = clone(state);
    const world = worldById.get(worldId);
    if (!result.started || !world) return result;
    if (result.active && result.active.worldId === worldId) return result;
    const firstUnsolved = world.questions.findIndex(question => !result.records[question.id]?.solved);
    result.active = {
      worldId,
      index: firstUnsolved < 0 ? 0 : firstUnsolved,
      replay: firstUnsolved < 0,
      records: {},
      choiceOrder: Object.fromEntries(world.questions.map(question => [question.id, shuffle(question.choices.map(choice => choice.id))])),
      wrongChoices: {}
    };
    result.updatedAt = now();
    return result;
  }

  function answer(state, choiceId) {
    const result = clone(state);
    const question = current(result);
    if (!question || !question.choices.some(choice => choice.id === choiceId)) return result;
    const record = recordFor(result, question.id);
    const wrong = result.active.wrongChoices[question.id] || [];
    if (record.solved || wrong.includes(choiceId)) return result;
    const correct = choiceId === question.answer;
    recordsFor(result)[question.id] = { ...record, attempts: Math.min(Number.MAX_SAFE_INTEGER, record.attempts + 1), solved: correct };
    if (!correct) result.active.wrongChoices[question.id] = [...wrong, choiceId];
    result.updatedAt = now();
    return result;
  }

  function hint(state) {
    const result = clone(state);
    const question = current(result);
    if (!question) return result;
    const record = recordFor(result, question.id);
    if (record.solved || record.hints === 1) return result;
    recordsFor(result)[question.id] = { ...record, hints: 1 };
    result.updatedAt = now();
    return result;
  }

  function next(state) {
    const result = clone(state);
    const question = current(result);
    if (!question || !recordFor(result, question.id).solved) return result;
    const world = worldById.get(result.active.worldId);
    if (result.active.index + 1 >= world.questions.length) result.active = null;
    else result.active.index += 1;
    result.updatedAt = now();
    return result;
  }

  function summary(state) {
    const summaries = worlds.map(world => {
      const records = world.questions.map(question => state.records[question.id] || emptyRecord());
      const solved = records.filter(record => record.solved).length;
      return {
        id: world.id,
        total: world.questions.length,
        solved,
        attempts: records.reduce((total, record) => total + record.attempts, 0),
        hints: records.reduce((total, record) => total + record.hints, 0),
        completed: solved === world.questions.length
      };
    });
    return {
      total: summaries.reduce((total, world) => total + world.total, 0),
      solved: summaries.reduce((total, world) => total + world.solved, 0),
      attempts: summaries.reduce((total, world) => total + world.attempts, 0),
      hints: summaries.reduce((total, world) => total + world.hints, 0),
      completedWorlds: summaries.filter(world => world.completed).length,
      worlds: summaries
    };
  }

  function reset(state) {
    const result = createState();
    if (state && avatars.has(state.avatar)) result.avatar = state.avatar;
    if (state && typeof state.soundEnabled === 'boolean') result.soundEnabled = state.soundEnabled;
    return result;
  }

  function isObject(value) {
    return value !== null && typeof value === 'object' && !Array.isArray(value);
  }

  function exactKeys(value, keys) {
    return isObject(value) && Object.keys(value).length === keys.length && keys.every(key => own(value, key));
  }

  function isIso(value) {
    if (typeof value !== 'string') return false;
    const date = new Date(value);
    return Number.isFinite(date.getTime()) && date.toISOString() === value;
  }

  function validRecords(records, allowedIds) {
    return isObject(records) && Object.entries(records).every(([id, record]) => {
      return allowedIds.has(id)
        && exactKeys(record, ['attempts', 'hints', 'solved'])
        && Number.isSafeInteger(record.attempts) && record.attempts >= 0
        && (record.hints === 0 || record.hints === 1)
        && typeof record.solved === 'boolean'
        && (!record.solved || record.attempts >= 1);
    });
  }

  function validActive(active, globalRecords) {
    if (active === null) return true;
    if (!exactKeys(active, ['worldId', 'index', 'replay', 'records', 'choiceOrder', 'wrongChoices'])) return false;
    const world = worldById.get(active.worldId);
    if (!world || !Number.isInteger(active.index) || active.index < 0 || active.index >= world.questions.length || typeof active.replay !== 'boolean') return false;
    const ids = new Set(world.questions.map(question => question.id));
    if (!validRecords(active.records, ids) || (!active.replay && Object.keys(active.records).length > 0)) return false;
    if (active.replay && !world.questions.every(question => globalRecords[question.id]?.solved)) return false;
    const records = active.replay ? active.records : globalRecords;
    if (!world.questions.slice(0, active.index).every(question => records[question.id]?.solved)) return false;
    if (!isObject(active.choiceOrder) || Object.keys(active.choiceOrder).length !== world.questions.length) return false;
    for (const question of world.questions) {
      const order = active.choiceOrder[question.id];
      const choiceIds = new Set(question.choices.map(choice => choice.id));
      if (!Array.isArray(order) || order.length !== choiceIds.size || new Set(order).size !== choiceIds.size || !order.every(id => choiceIds.has(id))) return false;
    }
    if (!isObject(active.wrongChoices)) return false;
    return Object.entries(active.wrongChoices).every(([id, wrong]) => {
      if (!ids.has(id) || !Array.isArray(wrong) || new Set(wrong).size !== wrong.length) return false;
      const question = questionById.get(id);
      const incorrect = new Set(question.choices.filter(choice => choice.id !== question.answer).map(choice => choice.id));
      const record = records[id] || emptyRecord();
      return wrong.every(choiceId => incorrect.has(choiceId)) && record.attempts >= wrong.length + (record.solved ? 1 : 0);
    });
  }

  function restore(raw) {
    try {
      if (typeof raw !== 'string') return createState();
      const state = JSON.parse(raw);
      if (!exactKeys(state, ['version', 'started', 'avatar', 'soundEnabled', 'startedAt', 'updatedAt', 'records', 'active'])) return createState();
      if (state.version !== 1 || typeof state.started !== 'boolean' || !avatars.has(state.avatar) || typeof state.soundEnabled !== 'boolean') return createState();
      if (!isIso(state.startedAt) || !isIso(state.updatedAt)) return createState();
      if (!validRecords(state.records, new Set(questionById.keys())) || !validActive(state.active, state.records)) return createState();
      if (!state.started && (Object.keys(state.records).length > 0 || state.active !== null)) return createState();
      return clone(state);
    } catch (_) {
      return createState();
    }
  }

  root.GameCore = Object.freeze({ createState, restore, start, startWorld, answer, hint, next, summary, reset });
})(typeof window !== 'undefined' ? window : globalThis);

</script>

        <button class="listen-button" data-action="listen">${icon('speaker')}<span data-listen-label>Ouvir a pergunta</span></button><div id="audio-notice-slot">${audioFallbackHTML()}</div>
        ${sceneHTML(q.scene)}
        <div class="choices" role="group" aria-label="Opções de resposta">${choices.map(choice=>`<button class="choice ${!choice.art ? 'numeric' : ''} ${choice.art && choice.art.startsWith('cat-') ? 'spatial' : ''} ${r.solved && choice.id === q.answer ? 'correct' : wrong.includes(choice.id) ? 'wrong' : ''}" data-action="answer" data-choice="${esc(choice.id)}" aria-label="${esc(choice.speak || choice.label)}" ${r.solved || wrong.includes(choice.id) ? 'disabled' : ''}>${r.solved && choice.id === q.answer ? `<span class="choice-mark" aria-hidden="true">${icon('check')}</span>` : ''}${choice.art ? A.icon(choice.art) : ''}<span class="choice-label">${esc(choice.label)}</span>${wrong.includes(choice.id) ? '<span class="choice-note">Vamos olhar de novo</span>' : ''}</button>`).join('')}</div>
        ${!r.solved ? `<div class="hint-row"><button class="hint-button" data-action="hint">${icon('help')}${helper ? state.soundEnabled ? 'Ouvir a dica' : 'Ver a dica' : 'Quero uma dica'}</button></div>` : ''}
        ${feedback ? `<div id="feedback" class="feedback ${r.solved ? 'good' : ''}" tabindex="-1"><span class="feedback-art">${buddyArt(r.solved ? 'celebrate' : 'happy')}</span><div><strong>${r.solved ? 'Que descoberta!' : feedbackKind === 'wrong' ? 'Vamos tentar mais uma vez?' : 'Uma ajudinha para você'}</strong>${esc(feedback)}</div></div>` : ''}
        ${r.solved ? `<div class="question-actions"><button class="btn btn-primary" data-action="next">${state.active.index === world.questions.length - 1 ? 'Terminar esta trilha' : 'Próxima brincadeira'} ${icon('arrow')}</button></div>` : ''}
      </section>
      <details class="support-text" id="text-support" ${audioMessage ? 'open' : ''}><summary>Apoio do educador: ler a instrução completa</summary><p>${esc(q.spokenPrompt || q.prompt)}</p></details>
      <p class="companion-line">${A.icon(state.avatar)}<span>${esc(buddies[state.avatar].name)} está com você. Pode pensar com calma!</span></p>
    </div>`;
  }
  function badgesHTML() {
    return `<div class="badge-row" role="list" aria-label="Trilhas exploradas">${W.map(w=>`<div class="earned-badge ${worldStats(w.id).completed ? '' : 'locked'}" role="listitem" aria-label="${esc(w.title)}: ${worldStats(w.id).completed ? 'explorada' : 'a explorar'}">${A.icon(w.icon)}${worldStats(w.id).completed ? `<span class="tiny-tick">${icon('check')}</span>` : ''}</div>`).join('')}</div>`;
  }
  function celebrateHTML(finish) {
    const world = worldById(celebratedWorld) || W[0];
    const s = C.summary(state);
    const all = s.completedWorlds === W.length;
    return `<div class="shell"><section class="celebrate" aria-labelledby="page-title"><div class="celebrate-art">${buddyArt('celebrate')}<span class="celebrate-star">${A.icon('star')}</span><span class="celebrate-flower">${A.icon('flower')}</span><div class="confetti" aria-hidden="true">${'<i></i>'.repeat(6)}</div></div>
      <div class="eyebrow">${finish ? 'Uma aventura cheia de descobertas' : celebrationReplay ? 'Brincar de novo também é descobrir' : 'Mais uma trilha explorada'}</div><h1 id="page-title">${finish ? 'Olha quanta coisa<br>você descobriu!' : 'Você fez o quintal florescer!'}</h1>
      <p>${finish ? 'Você brincou com cores, números, lugares, bichos, sons e letras. Cada tentativa fez parte dessa aventura!' : `Você explorou <strong>${esc(world.title)}</strong> e completou as quatro brincadeiras. ${all ? 'Todas as trilhas do quintal estão floridas!' : 'Que tal descobrir outro cantinho?'}`}</p>
      ${badgesHTML()}
      ${finish ? `<div class="celebrate-card"><h2>Uma conquista do seu jeito.</h2><div class="celebrate-stats"><div><strong>6</strong><span>trilhas exploradas</span></div><div><strong>24</strong><span>descobertas</span></div></div><p>Conte para alguém: de qual brincadeira você mais gostou?</p></div>` : ''}
      <div class="celebrate-actions">${!finish && all ? `<button class="btn btn-primary" data-action="finish">Ver minha conquista ${icon('star')}</button>` : `<button class="btn btn-primary" data-action="map">${finish ? 'Brincar mais um pouco' : 'Escolher outra trilha'} ${icon('arrow')}</button>`}${finish ? '<button class="btn btn-secondary" data-action="home">Voltar ao início</button>' : `<button class="btn btn-secondary" data-action="world" data-world="${world.id}">Brincar de novo ${icon('refresh')}</button>`}</div>
      ${!finish ? `<p class="small-note">${s.completedWorlds} de 6 trilhas exploradas. Seu próximo caminho está esperando.</p>` : '<p class="small-note">A aventura termina aqui. A curiosidade vai com você!</p>'}
    </section></div>`;
  }
  function prettyDate(value) {
    try { return new Date(value).toLocaleString('pt-BR', { dateStyle:'short',timeStyle:'short' }); }
    catch (_) { return ''; }
  }
  function teacherHTML() {
    const s = C.summary(state);
    return `<div class="shell teacher-page"><div class="page-top teacher-heading"><div><span class="teacher-label">${icon('teacher')}Espaço do educador</span><h1 id="page-title">Acompanhar as descobertas</h1><p>Um registro simples para apoiar sua observação e a conversa com a criança.</p></div><button class="btn btn-secondary" data-action="teacher-back">Voltar à brincadeira ${icon('arrow')}</button></div>
      <div class="teacher-notice"><strong>Uma aventura por vez, neste navegador.</strong> Este jogo não pede nome, idade exata ou cadastro. Os registros ficam no armazenamento local deste navegador e não são enviados a um servidor pelo jogo. Em um computador compartilhado, exporte o que precisa e inicie uma nova aventura antes de outra criança jogar.</div>
      <div class="stats-grid"><div class="stat-card"><strong>${s.completedWorlds}<span>de 6 trilhas</span></strong><span>Exploradas</span></div><div class="stat-card"><strong>${s.solved}<span>de 24 brincadeiras</span></strong><span>Concluídas</span></div><div class="stat-card"><strong>${s.attempts}</strong><span>Respostas selecionadas</span></div><div class="stat-card"><strong>${s.hints}</strong><span>Atividades com dica solicitada</span></div></div>
      ${!state.started ? '<div class="no-records">A aventura ainda não começou. Depois que a criança brincar, os registros aparecerão aqui.</div>' : ''}
      <div class="section-title"><div><h2 style="font-size:25px">Observações por trilha</h2><p>Registros da primeira exploração. Repetições de trilhas concluídas não alteram estes números.</p></div></div>
      ${W.map(w=>{
        const st = worldStats(w.id);
        return `<details class="report-world"><summary><span class="report-icon">${A.icon(w.icon)}</span><span><strong>${esc(w.title)}</strong><small>${esc(w.skill)}</small></span><span class="report-count">${st.solved} / ${st.total}</span><span class="report-expand" aria-hidden="true">+</span></summary><div class="report-table-wrap"><table class="report-table"><caption class="sr-only">Registros da trilha ${esc(w.title)}</caption><thead><tr><th scope="col">Atividade</th><th scope="col">Respostas</th><th scope="col">Dica solicitada</th><th scope="col">Situação</th></tr></thead><tbody>${w.questions.map(q=>{const r=state.records[q.id]||{attempts:0,hints:0,solved:false};return `<tr><td>${esc(q.prompt)}<small>${esc(q.skill)}</small></td><td>${r.attempts}</td><td>${r.hints ? 'Sim' : 'Não'}</td><td><span class="status-label ${r.solved ? '' : 'todo'}">${r.solved ? 'Concluída' : r.attempts || r.hints ? 'Em exploração' : 'A explorar'}</span></td></tr>`;}).join('')}</tbody></table></div></details>`;
      }).join('')}
      <div class="teacher-tools"><button class="btn btn-primary" data-action="export" ${!state.started ? 'disabled' : ''}>${icon('download')}Exportar observações (CSV)</button><p class="session-note">${state.started ? `Início desta aventura: ${esc(prettyDate(state.startedAt))}<br>Último registro: ${esc(prettyDate(state.updatedAt))}` : 'Nenhuma aventura iniciada.'}</p></div>
      <section class="teacher-guide"><h2>Como usar estes registros</h2><p>Uma atividade concluída mostra que a resposta esperada foi selecionada, inclusive após dicas e novas tentativas. Esses números <strong>não são notas nem diagnóstico de aprendizagem</strong>. Observe as estratégias, a linguagem, a participação e a necessidade de mediação da criança. Uma dica pode aparecer após uma tentativa; a coluna de dicas conta somente pedidos no botão.</p>
        <ul><li><strong>Leitura e escuta:</strong> as instruções podem ser narradas. A voz depende do dispositivo e pode precisar de internet. Se não houver voz em português ou ela falhar, abra o apoio textual e leia para a criança.</li><li><strong>Atividades orais:</strong> repita as palavras com naturalidade, nomeie as figuras e acompanhe as palmas. O jogo não grava a fala e não reconhece palmas.</li><li><strong>Participação:</strong> adapte a mediação para crianças com dificuldades de visão, audição, leitura, percepção de cores ou uso do mouse. O teclado também pode selecionar os controles.</li><li><strong>Validação:</strong> o banco de atividades é uma proposta inicial para revisão docente e teste com o público. Não há validação institucional ou pedagógica concluída nesta versão.</li></ul>

  function render(options) {
    const opts = options || {};
    header.innerHTML = headerHTML();
    const screens = {home:homeHTML,welcome:welcomeHTML,map:mapHTML,question:questionHTML,celebrate:()=>celebrateHTML(false),finish:()=>celebrateHTML(true),teacher:teacherHTML};
    main.innerHTML = (screens[screen] || homeHTML)();
    footer.innerHTML = footerHTML();
    document.body.className = `page-${screen}`;
    const pageName = main.querySelector('#page-title');
    document.title = `${pageName ? pageName.textContent.replace(/\s+/g,' ').trim() : 'Vamos brincar?'} · Quintal das Descobertas`;
    if (!opts.keepScroll) window.scrollTo({top:0,behavior:'instant'});
    if (opts.focus !== false) {
      const target = main.querySelector(opts.focusSelector || '#page-title') || main;
      if (!target.matches('button,a,input,summary')) target.setAttribute('tabindex','-1');
      target.focus({preventScroll:true});
    }
    showStorageNotice();
  }
  function navigate(nextScreen, options) {
    cancelSpeech();
    feedbackKind = '';
    audioMessage = '';
    screen = nextScreen;
    render(options);
  }
  function beginWorld(worldId) {
    if (!worldById(worldId)) return;
    if (!state.started) save(C.start(state,selectedAvatar));
    save(C.startWorld(state,worldId));
    navigate('question');
    narrateCurrent();
  }
  function narrateCurrent() {
    const x = current();
    if (screen === 'question' && x && state.soundEnabled) speak(recordFor(x.q.id).solved ? x.q.success : x.q.spokenPrompt || x.q.prompt);
  }
  function updateVoices() {
    if ('speechSynthesis' in window) {
      try { voices = window.speechSynthesis.getVoices(); } catch (_) { voices = []; }
    }
  }
  function speakingUI(on) {
    const b = main.querySelector('[data-action="listen"]');
    if (b) {
      b.classList.toggle('speaking', on);
      const label = b.querySelector('[data-listen-label]');
      if (label) label.textContent = on ? 'Repetir a pergunta' : 'Ouvir a pergunta';
    }
  }
  function cancelSpeech() {
    speechId++;
    clearTimeout(speechTimer);
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (_) {}
    activeUtterance = null;
    speakingUI(false);
  }
  function audioFallback(message) {
    audioMessage = message || 'Não conseguimos reproduzir a voz. Peça a um adulto para ler a instrução completa abaixo.';
    const slot = document.getElementById('audio-notice-slot');
    if (slot) slot.innerHTML = audioFallbackHTML();
    const support = document.getElementById('text-support');
    if (support) support.open = true;
    speakingUI(false);
    announce(audioMessage);
  }
  function speak(text) {
    cancelSpeech();
    const thisSpeech = speechId;
    if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
      audioFallback('Este navegador não oferece narração. Um adulto pode ler a instrução completa abaixo.');
      return;
    }
    updateVoices();
    const voice = voices.find(v=>v.lang.replace('_','-').toLowerCase()==='pt-br') || voices.find(v=>/^pt[-_]?/i.test(v.lang));
    if (voices.length && !voice) {
      audioFallback('Não encontramos uma voz em português neste dispositivo. Um adulto pode ler a instrução completa abaixo.');
      return;
    }
    try {
      const utterance = new SpeechSynthesisUtterance(text);
      activeUtterance = utterance;
      utterance.lang = 'pt-BR';
      utterance.rate = .86;
      utterance.pitch = 1.04;
      if (voice) utterance.voice = voice;
      utterance.onstart = () => {
        if (thisSpeech !== speechId) return;
        clearTimeout(speechTimer);
        audioMessage = '';
        const slot = document.getElementById('audio-notice-slot');
        if (slot) slot.innerHTML = '';
        speakingUI(true);
      };
      utterance.onend = () => { if(thisSpeech === speechId) { clearTimeout(speechTimer); activeUtterance = null; speakingUI(false); } };
      utterance.onerror = event => {
        if (thisSpeech !== speechId || ['canceled','interrupted'].includes(event.error)) return;
        clearTimeout(speechTimer);
        audioFallback();
      };
      speechTimer = window.setTimeout(()=>{ if(thisSpeech===speechId) { cancelSpeech(); audioFallback(); } },3500);
      window.speechSynthesis.speak(utterance);
    } catch (_) { clearTimeout(speechTimer); audioFallback(); }
  }
  function showDialog(type) {
    cancelSpeech();
    previousFocus = document.activeElement;
    const close = `<button class="dialog-close" data-action="modal-close" aria-label="Fechar">${icon('close')}</button>`;
    if (type === 'how') dialog.innerHTML = `${close}<h2 id="dialog-title">Vamos brincar juntos?</h2><ol class="dialog-steps"><li><strong>Escolha um caminho</strong><span>São seis trilhas. Você pode começar por qualquer uma!</span></li><li><strong>Olhe e escute</strong><span>Toque no alto-falante para ouvir a pergunta. Se precisar, peça ajuda a um adulto.</span></li><li><strong>Toque na sua resposta</strong><span>Você pode pedir uma dica e tentar novamente. Depois, siga para a próxima brincadeira.</span></li></ol><p>Ao terminar as seis trilhas, você terá um quintal cheio de descobertas. Pode fazer pausas!</p><div class="dialog-actions"><button class="btn btn-primary" data-action="modal-close">Entendi! ${icon('check')}</button></div>`;
    if (type === 'about') dialog.innerHTML = `${close}<h2 id="dialog-title">Quintal das Descobertas</h2><p>Versão inicial de um jogo educacional para crianças de 5 a 6 anos, desenvolvida a partir do escopo do Projeto de Curricularização da Extensão de Sistemas de Informação da UNIFEBE, em parceria com a Secretaria Municipal de Educação de Brusque.</p><p>São seis trilhas e 24 atividades com cores, formas, quantidades, noções espaciais, animais, sons e letras. As ilustrações desta versão foram criadas para o jogo.</p><p>O conteúdo ainda deve ser validado pelos educadores. Esta versão não representa aprovação institucional. Os registros da aventura ficam neste navegador; não há cadastro.</p><div class="dialog-actions"><button class="btn btn-primary" data-action="modal-close">Voltar ao quintal</button></div>`;
    if (type === 'reset') dialog.innerHTML = `${close}<h2 id="dialog-title">Começar uma nova aventura?</h2><p>As descobertas e observações desta aventura serão apagadas deste navegador. Essa ação não tem volta. Exporte o CSV antes se precisar guardar os registros.</p><div class="dialog-actions"><button class="btn btn-secondary" data-action="modal-close">Manter esta aventura</button><button class="btn btn-danger" data-action="reset">Apagar e recomeçar</button></div>`;
    dialog.showModal();
    const safe = dialog.querySelector('[data-action="modal-close"]');
    if (safe) safe.focus();
  }
  function closeDialog() {
    dialog.close();
    if (previousFocus && previousFocus.isConnected) previousFocus.focus();
  }
  function exportCSV() {
    const rows = [['Trilha','Habilidade','Atividade','Respostas selecionadas','Dica solicitada','Concluída','Início da aventura','Último registro']];
    W.forEach(w=>w.questions.forEach(q=>{
      const r=state.records[q.id]||{attempts:0,hints:0,solved:false};
      rows.push([w.title,q.skill,q.prompt,r.attempts,r.hints?'Sim':'Não',r.solved?'Sim':'Não',state.startedAt,state.updatedAt]);
    }));
    const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`quintal-observacoes-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.setTimeout(()=>URL.revokeObjectURL(url),2000);
    announce('Arquivo de observações preparado para download.');
  }

  document.addEventListener('click', event=>{
    const button=event.target.closest('[data-action]');
    if(!button || button.disabled) return;
    const action=button.dataset.action;
    if(action==='home') { requestedWorld=null; return navigate('home'); }
    if(action==='map') { requestedWorld=null; return navigate(state.started ? 'map' : 'welcome'); }
    if(action==='start') { requestedWorld=null; navigate(state.started ? state.active ? 'question' : C.summary(state).completedWorlds===W.length ? 'finish' : 'map' : 'welcome'); if(screen==='question')narrateCurrent(); return; }
    if(action==='choose-world') { selectedAvatar=state.avatar; requestedWorld=button.dataset.world; navigate('welcome'); return; }
    if(action==='avatar') { selectedAvatar=button.dataset.avatar; render({keepScroll:true,focusSelector:`[data-avatar="${selectedAvatar}"]`}); return; }
    if(action==='welcome-next') { save(C.start(state,selectedAvatar)); if(requestedWorld){ const target=requestedWorld;requestedWorld=null;beginWorld(target); } else navigate('map'); return; }
    if(action==='world') return beginWorld(button.dataset.world);
    if(action==='listen') { const x=current(); if(x) speak(x.q.spokenPrompt || x.q.prompt); return; }
    if(action==='sound') {
      save({...state,soundEnabled:!state.soundEnabled,updatedAt:new Date().toISOString()});
      header.innerHTML=headerHTML();
      header.querySelector('[data-action="sound"]').focus();
      if(!state.soundEnabled)cancelSpeech(); else narrateCurrent();
      announce(state.soundEnabled?'Narração automática ativada.':'Narração automática desativada. O botão Ouvir a pergunta continua disponível.');
      return;
    }
    if(action==='answer') {
      const x=current(); if(!x)return;
      const r=recordFor(x.q.id); if(r.solved)return;
      const correct=button.dataset.choice===x.q.answer;
      cancelSpeech();
      save(C.answer(state,button.dataset.choice));
      feedbackKind=correct?'correct':'wrong';
      render({keepScroll:true,focusSelector:correct?'[data-action="next"]':'#feedback'});
      const message=correct?x.q.success:`Vamos tentar mais uma vez? ${x.q.hint}`;
      announce(message);
      if(state.soundEnabled)speak(message);
      return;
    }
    if(action==='hint') {
      const x=current(); if(!x)return;
      save(C.hint(state)); feedbackKind='hint';
      render({keepScroll:true,focusSelector:'#feedback'});
      announce(x.q.hint);
      if(state.soundEnabled)speak(x.q.hint);
      return;
    }
    if(action==='next') {
      const x=current(); if(!x||!recordFor(x.q.id).solved)return;
      const last=state.active.index===x.world.questions.length-1;
      celebratedWorld=x.world.id; celebrationReplay=state.active.replay;
      save(C.next(state));
      navigate(last?'celebrate':'question');
      if(!last)narrateCurrent();
      else if(state.soundEnabled)speak('Você completou esta trilha! Que tal descobrir outro cantinho?');
      return;
    }
    if(action==='finish') { if(C.summary(state).completedWorlds===W.length)navigate('finish'); return; }
    if(action==='teacher') { if(screen!=='teacher')teacherReturn=screen; navigate('teacher'); return; }
    if(action==='teacher-back') { navigate(teacherReturn==='question'&&!state.active?'map':teacherReturn); if(screen==='question')narrateCurrent(); return; }
    if(action==='how'||action==='about') return showDialog(action);
    if(action==='modal-close') return closeDialog();
    if(action==='reset-confirm') return showDialog('reset');
    if(action==='reset') { closeDialog(); save(C.reset(state)); selectedAvatar=state.avatar; requestedWorld=null; navigate('welcome'); announce('Uma nova aventura está pronta para começar.'); return; }
    if(action==='export') return exportCSV();
  });
  dialog.addEventListener('cancel', ()=>cancelSpeech());
  document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelSpeech();});
  window.addEventListener('pagehide',cancelSpeech);
  updateVoices();
  if('speechSynthesis' in window && typeof window.speechSynthesis.addEventListener==='function')window.speechSynthesis.addEventListener('voiceschanged',updateVoices);
  render({focus:false});
})();

</script>
</body>
</html>
